[project]
name = "global-generation-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.112.4",
    "uvicorn[standard]==0.30.6",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "ruff==0.12.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
