[project]
name = "global-generation-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi==0.141.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.3.0",
    "uvicorn[standard]==0.52.1",
]


[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "pytest-mock>=3.15.1", "ruff==0.16.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
